<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Free CC0 animated 3D characters for the game projects, ready to load in Three.js and Unity.">
<title>Model Lab</title>
<style>
  :root {
    --bg: #0f151b; --panel: #17212a; --panel-2: #1e2b36; --line: #2a3945;
    --text: #e9eff4; --muted: #94a5b3; --accent: #7fd1b9; --accent-ink: #0a1a15;
    --radius: 10px; --gutter: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 372px; height: 100dvh; overflow: hidden; }
  #stage { position: relative; min-width: 0; min-height: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: absolute; left: var(--gutter); top: var(--gutter); right: var(--gutter); pointer-events: none;
         display: flex; flex-direction: column; gap: 4px; text-shadow: 0 1px 3px rgba(0,0,0,.55); }
  #hud h1 { margin: 0; font-size: 18px; font-weight: 650; color: #fff; }
  #hud p { margin: 0; font-size: 13px; color: #eef5fa; opacity: .92; }
  #err { color: #ffd2cc; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: var(--gutter);
          display: flex; flex-direction: column; gap: 18px; -webkit-overflow-scrolling: touch; }
  h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
  .packs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pack { text-align: left; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
          border-radius: var(--radius); padding: 10px 11px; cursor: pointer; font: inherit; }
  .pack b { display: block; font-size: 14px; margin-bottom: 3px; }
  .pack span { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; }
  .pack[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 999px;
          padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; min-height: 34px; }
  .chip:hover, .pack:hover { border-color: #3d5262; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .group { margin-top: 12px; }
  .group:first-child { margin-top: 0; }
  .group h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label.speed { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex: 1 1 160px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 0; }
  .note a { color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  @media (max-width: 780px) {
    body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 46dvh; }
    aside { border-left: 0; border-top: 1px solid var(--line); padding-bottom: calc(var(--gutter) + env(safe-area-inset-bottom)); }
    #hud h1 { font-size: 16px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
  <div id="stage">
    <div id="hud">
      <h1 id="title">Model Lab</h1>
      <p id="stats">Loading...</p>
      <p id="err" hidden></p>
    </div>
  </div>
  <aside>
    <section>
      <h2>Pack</h2>
      <div class="packs" id="packs"></div>
    </section>
    <section>
      <h2>Character</h2>
      <div class="chips" id="chars"></div>
    </section>
    <section id="hairSec" hidden>
      <h2>Hair</h2>
      <div class="chips" id="hair"></div>
      <div class="chips" id="hairColor" style="margin-top:8px"></div>
    </section>
    <section>
      <h2>Animation</h2>
      <div id="anims"></div>
    </section>
    <section>
      <h2>View</h2>
      <div class="row" id="views"></div>
      <div class="row" style="margin-top:10px">
        <label class="speed">Speed <input type="range" id="speed" min="0.2" max="2" step="0.1" value="1"></label>
      </div>
    </section>
    <section>
      <p class="note">All models here are CC0 (public domain): Quaternius and Kay Lousberg (KayKit). They were converted to GLB and shrunk for the web. Drag to orbit, pinch or scroll to zoom.</p>
    </section>
  </aside>
  <script type="module" src="viewer.js"></script>
</body>
</html>
