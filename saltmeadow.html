<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saltmeadow</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b1020; color: #eef1f4; font: 14px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #top { position: fixed; top: 10px; right: 12px; display: flex; gap: 6px; align-items: center; z-index: 3; flex-wrap: wrap; justify-content: flex-end; }
  #clock { font-weight: 600; padding: 6px 10px; background: #0009; border-radius: 8px; min-width: 150px; text-align: center; }
  #top button { background: #0009; color: #eef1f4; border: 1px solid #fff3; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  #top button.on { border-color: #ffd27a; color: #ffd27a; }
  #title { position: fixed; top: 10px; left: 14px; font: 600 20px Georgia, serif; letter-spacing: .5px; text-shadow: 0 2px 6px #000a; z-index: 3; }
  #caption { position: fixed; left: 16px; bottom: 18px; max-width: min(640px, 80vw); font: 500 20px Georgia, serif;
             text-shadow: 0 2px 8px #000; z-index: 3; transition: opacity .6s; }
  #caption small { display: block; font: 13px system-ui, sans-serif; opacity: .75; margin-bottom: 2px; }
  #log { position: fixed; right: 12px; bottom: 16px; width: min(320px, 44vw); z-index: 3; font-size: 13px; }
  #log div { background: #000a; padding: 5px 9px; border-radius: 7px; margin-top: 5px; transition: opacity 1s; }
  #log b { color: #ffd27a; font-weight: 600; margin-right: 6px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0b1020; z-index: 5; font: 18px Georgia, serif; transition: opacity 1s; }
  #loading .bar { width: 260px; height: 6px; background: #ffffff22; border-radius: 3px; margin-top: 12px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: #ffd27a; transition: width .2s; }
  @media (max-width: 600px) { #caption { font-size: 16px; } #log { display: none; } #title { font-size: 16px; } }
</style>

<div id="loading"><div><div id="loadText">Building Saltmeadow...</div><div class="bar"><i id="loadBar"></i></div></div></div>

<div id="top">
  <span id="clock">Day 1 · 3:00 pm</span>
  <button data-speed="1" class="on">1x</button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CDN = 'https://polyfork.dev/cdn/';
const DAY = 720;              // real seconds for one day at 1x
const START_HOUR = +(new URLSearchParams(location.search).get('h') ?? 15);   // ?h=21 starts at 9 pm

// ------------------------------------------------------------------ helpers
let seed = 20261027;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];
const lerpAngle = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI; if (d < -Math.PI) d += Math.PI * 2; return a + d * t; };
const faceYaw = (fx, fz, tx, tz) => Math.atan2(tx - fx, tz - fz);
const V = (x, z, y = 0) => new THREE.Vector3(x, y, z);

// ------------------------------------------------------------------ renderer + scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color();
scene.fog = new THREE.Fog(0x9cc4e4, 140, 420);
const camera = new THREE.PerspectiveCamera(48, 1, 0.2, 1500);
camera.position.set(90, 60, 110);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.48;
controls.enabled = false;
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const hemi = new THREE.HemisphereLight(0xdfefff, 0x4a5a32, 1.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dc, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 1, far: 400 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const moon = new THREE.DirectionalLight(0x7f9cff, 0);
scene.add(moon, moon.target);

// ------------------------------------------------------------------ ground, beach, sea, roads
function groundY(x, z) {
  if (Math.abs(x) < 3.2 && z > 48 && z < 88) return 0.35;          // pier deck
  if (z > 44) return Math.max(-1.2, -(z - 44) / 18);
  return 0;
}
const land = new THREE.Mesh(new THREE.PlaneGeometry(800, 400).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x6f9a4a }));
land.position.set(0, 0, 44 - 200);
land.receiveShadow = true;
scene.add(land);
{
  const g = new THREE.PlaneGeometry(800, 22, 4, 8).rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const z = p.getZ(i) + 55; p.setY(i, -Math.min(1.2, (z - 44) / 18)); }
  g.computeVertexNormals();
  const beach = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: 0xe2cf98 }));
  beach.position.z = 55;
  beach.receiveShadow = true;
  scene.add(beach);
  const sand = new THREE.Mesh(new THREE.PlaneGeometry(800, 6).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xd8c48c }));
  sand.position.set(0, 0.01, 41.5);
  scene.add(sand);
}
const forestFloor = new THREE.Mesh(new THREE.CircleGeometry(60, 40).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x4f7a3a }));
forestFloor.position.set(-95, 0.012, -5); forestFloor.scale.set(1, 1, 1.3); forestFloor.receiveShadow = true;
scene.add(forestFloor);

const seaGeo = new THREE.PlaneGeometry(900, 520, 90, 52).rotateX(-Math.PI / 2);
const seaBase = Float32Array.from(seaGeo.attributes.position.array);
const sea = new THREE.Mesh(seaGeo, new THREE.MeshStandardMaterial({ color: 0x2f7aa6, roughness: 0.6, metalness: 0.05, flatShading: true }));
sea.position.set(0, -0.55, 50 + 260);
scene.add(sea);
function waveAt(x, z, t) { return Math.sin(x * 0.09 + t * 1.1) * 0.28 + Math.sin(z * 0.13 - t * 0.8) * 0.22 + Math.sin((x + z) * 0.05 + t * 0.5) * 0.3; }
function updateSea(t) {
  const p = seaGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = seaBase[i * 3], z = seaBase[i * 3 + 2];
    p.setY(i, waveAt(x, z + 310, t));
  }
  p.needsUpdate = true;
  seaGeo.computeVertexNormals();
}

// road graph: agents walk node to node, then step off to their spot
const NODES = {
  plaza: [0, 0], n1: [0, -24], chapel: [0, -40], w1: [-28, 0], w2: [-52, 4], forest: [-68, 6],
  e1: [28, 0], e2: [46, 2], farm: [56, 10], s1: [0, 24], harbor: [0, 44], pier: [0, 80],
  ne: [22, -30], mill: [30, -42], nw: [-24, -28], tower: [-36, -38], se: [22, 44], sw: [-22, 44],
  pasture: [50, -14],
};
const EDGES = [['plaza', 'n1'], ['n1', 'chapel'], ['plaza', 'w1'], ['w1', 'w2'], ['w2', 'forest'], ['plaza', 'e1'], ['e1', 'e2'],
  ['e2', 'farm'], ['plaza', 's1'], ['s1', 'harbor'], ['harbor', 'pier'], ['n1', 'ne'], ['ne', 'mill'], ['n1', 'nw'], ['nw', 'tower'],
  ['harbor', 'se'], ['harbor', 'sw'], ['e2', 'pasture']];
const ADJ = {};
for (const [a, b] of EDGES) { (ADJ[a] ||= []).push(b); (ADJ[b] ||= []).push(a); }
function route(from, to) {
  const prev = { [from]: null }, q = [from];
  while (q.length) { const n = q.shift(); if (n === to) break; for (const m of ADJ[n]) if (!(m in prev)) { prev[m] = n; q.push(m); } }
  const out = []; for (let n = to; n; n = prev[n]) out.unshift(n);
  return out;
}
function nearestNode(x, z) {
  let best = 'plaza', bd = 1e9;
  for (const [k, [nx, nz]] of Object.entries(NODES)) { const d = (nx - x) ** 2 + (nz - z) ** 2; if (d < bd) { bd = d; best = k; } }
  return best;
}
{
  const mat = new THREE.MeshLambertMaterial({ color: 0xa88d5c });
  for (const [a, b] of EDGES) {
    if (b === 'pier') continue;
    const [ax, az] = NODES[a], [bx, bz] = NODES[b];
    const len = Math.hypot(bx - ax, bz - az);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(3.4, len).rotateX(-Math.PI / 2), mat);
    m.position.set((ax + bx) / 2, 0.03 + groundY((ax + bx) / 2, (az + bz) / 2) * 0, (az + bz) / 2);
    m.rotation.y = Math.atan2(bx - ax, bz - az);
    m.receiveShadow = true;
    scene.add(m);
    const c = new THREE.Mesh(new THREE.CircleGeometry(1.7, 16).rotateX(-Math.PI / 2), mat);
    c.position.set(bx, 0.031, bz); scene.add(c);
  }
  const plaza = new THREE.Mesh(new THREE.CircleGeometry(15, 40).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xb8ab90 }));
  plaza.position.y = 0.035; plaza.receiveShadow = true; scene.add(plaza);
  // pier
  const wood = new THREE.MeshLambertMaterial({ color: 0x8a6440 });
  const deck = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.3, 40), wood);
  deck.position.set(0, 0.2, 68); deck.castShadow = deck.receiveShadow = true; scene.add(deck);
  for (let z = 50; z <= 88; z += 4) for (const x of [-3, 3]) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 3.2), wood);
    post.position.set(x, -1.2, z); post.castShadow = true; scene.add(post);
  }
}

// sky dome bits: stars, clouds
const stars = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(
  Array.from({ length: 1500 * 3 }, (_, i) => { const k = Math.floor(i / 3), u = rnd(), v = rnd() * 0.9 + 0.08;
    const th = u * Math.PI * 2, ph = Math.acos(v); const r = 900;
    return [Math.cos(th) * Math.sin(ph) * r, Math.cos(ph) * r, Math.sin(th) * Math.sin(ph) * r][i % 3]; }), 3)),
  new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false }));
scene.add(stars);
const clouds = [];
{
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true, transparent: true, opacity: 0.92 });
  for (let i = 0; i < 16; i++) {
    const g = new THREE.Group();
    for (let j = 0; j < 6; j++) {
      const s = new THREE.Mesh(new THREE.IcosahedronGeometry(rr(5, 10), 0), mat);
      s.position.set(rr(-12, 12), rr(-2, 3), rr(-6, 6)); g.add(s);
    }
    g.position.set(rr(-350, 350), rr(80, 110), rr(-300, 250));
    g.userData.v = rr(1.5, 3.5);
    clouds.push(g); scene.add(g);
  }
}

// glow sprite for lamps and fires
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, '#fff6d0'); g.addColorStop(0.25, '#ffcf6aaa'); g.addColorStop(1, '#ff9a3000');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
function glow(size) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0 })); s.scale.setScalar(size); return s; }

// ------------------------------------------------------------------ loading models
const modCache = new Map(), protos = new Map();
let loadTotal = 0, loadDone = 0;
const loadBar = document.getElementById('loadBar'), loadText = document.getElementById('loadText');
function tick() { loadDone++; loadBar.style.width = (100 * loadDone / Math.max(1, loadTotal)) + '%'; loadText.textContent = `Building Saltmeadow... ${loadDone} of ${loadTotal}`; }
const mod = id => { if (!modCache.has(id)) modCache.set(id, import(CDN + id + '.mjs')); return modCache.get(id); };
async function make(id, fresh = false) {
  const m = await mod(id);
  let o;
  if (fresh) o = m.createAsset();
  else { if (!protos.has(id)) protos.set(id, m.createAsset()); o = protos.get(id).clone(); }
  o.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
  return o;
}
const placed = {};
const jobs = [];
function place(id, x, z, ry = 0, { s = 1, name, faceTo } = {}) {
  loadTotal++;
  jobs.push((async () => {
    try {
      const o = await make(id);
      o.position.set(x, groundY(x, z), z);
      o.rotation.y = faceTo ? faceYaw(x, z, faceTo[0], faceTo[1]) : ry;
      o.scale.setScalar(s);
      scene.add(o);
      if (name) placed[name] = o;
    } catch (e) { console.warn('model failed', id, e); }
    tick();
  })());
}
function scatter(ids, n, x0, x1, z0, z1, avoid = [], s = [0.85, 1.25]) {
  let made = 0, tries = 0;
  while (made < n && tries++ < n * 30) {
    const x = rr(x0, x1), z = rr(z0, z1);
    if (avoid.some(([ax, az, r]) => (x - ax) ** 2 + (z - az) ** 2 < r * r)) continue;
    place(pick(ids), x, z, rr(0, 6.28), { s: rr(...s) });
    made++;
  }
}
function fenceLine(id, a, b) {
  loadTotal++;
  jobs.push((async () => {
    const proto = await make(id);
    const size = new THREE.Box3().setFromObject(proto).getSize(new THREE.Vector3());
    const L = Math.max(size.x, 0.5);
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const n = Math.max(1, Math.round(len / L));
    const yaw = Math.atan2(b[0] - a[0], b[1] - a[1]) - Math.PI / 2;
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n, o = proto.clone();
      o.position.set(a[0] + (b[0] - a[0]) * t, 0, a[1] + (b[1] - a[1]) * t);
      o.rotation.y = yaw; o.scale.x = len / n / L;
      scene.add(o);
    }
    tick();
  })());
}

// ------------------------------------------------------------------ the town
const HOMES = {};
function house(id, name, x, z, faceTo = [0, 0]) { place(id, x, z, 0, { name, faceTo }); HOMES[name] = { x, z, faceTo }; }
house('village-tavern-4e94e3', 'tavern', 20, -17);
house('two-story-house-40f6dc', 'merchantHouse', -21, -15);
house('thatched-cottage-0e63f5', 'cottageA', -22, 15);
house('thatched-cottage-0e63f5', 'cottageB', 22, 17);
house('gabled-farmhouse-c7534f', 'farmhouse', 64, 4, [46, 2]);
house('log-cabin-4fac3b', 'cabin', -80, 8, [-68, 6]);
house('fisherman-shack-ea9b2b', 'shack', -20, 51, [0, 44]);
house('watchtower-140f78', 'guardTower', -38, -48, [-36, -38]);
house('stone-chapel-03e774', 'chapel', 0, -54, [0, -40]);
place('windmill-3aad49', 32, -56, 0, { name: 'windmill', faceTo: [30, -42] });
place('stilted-granary-3e7d7d', -38, -14, 0, { faceTo: [-28, 0] });
place('village-gatehouse-181a9e', -60, -26, 0, { faceTo: [-52, 4] });
place('clay-bread-oven-860b06', -10, -17, 0, { faceTo: [0, 0] });
place('village-well-f8e361', 0, 0);
place('roadside-farm-stand-e218ca', -9, 12, 0, { faceTo: [0, 0] });
place('signpost-8287c3', 5, -5, 0.7);
place('water-trough-318ee1', 11, -27, 0.2);
place('draft-horse-519160', 7, -28, 1.4);
place('four-wheel-wagon-adb946', -14, -27, 2.4);
place('wooden-cart-bf83d8', 13, 9, 0.8);
place('campfire-4390aa', 9, 8, 0, { name: 'campfire' });
for (const [x, z] of [[13, -9], [17, -6], [10, -12]]) place('campsite-picnic-table-361d51', x, z, 0.5);
place('orchard-apple-tree-b21f85', -13, 26); place('orchard-apple-tree-b21f85', 14, 28); place('orchard-apple-tree-b21f85', -30, 22);
// farm
place('red-barn-d41683', 82, -8, 0, { faceTo: [56, 10] });
place('grain-silo-58ca67', 92, 4);
place('chicken-coop-371f97', 40, 16, 0, { name: 'coop', faceTo: [46, 2] });
place('scarecrow-334079', 62, 32, 3.2);
place('tool-shed-f61f49', 76, 22, 0, { faceTo: [56, 10] });
place('hay-bale-079e8c', 72, -2, 0.3); place('hay-bale-079e8c', 74, -4, 1.2);
place('beehive-2e70bf', 38, 30, 0); place('beehive-2e70bf', 40, 32, 0.4);
const CROPS = ['wheat-crop-7e08e6', 'turnip-crop-a5b3b7', 'pumpkin-crop-7de137', 'corn-crop-b71f2f', 'strawberry-crop-6bec33'];
const FIELD = [];
for (let r = 0; r < 5; r++) for (let c = 0; c < 11; c++) {
  const x = 48 + c * 2.6, z = 24 + r * 3.4;
  place(CROPS[r], x, z, rnd() * 6, { s: 1 });
  if (c % 3 === 1) FIELD.push([x, z - 1.4, CROPS[r]]);
}
fenceLine('wooden-fence-section-d72055', [42, -34], [76, -34]);
fenceLine('wooden-fence-section-d72055', [76, -34], [76, -14]);
fenceLine('wooden-fence-section-d72055', [42, -34], [42, -14]);
fenceLine('wooden-fence-section-d72055', [42, -14], [47, -14]);
fenceLine('wooden-fence-section-d72055', [53, -14], [76, -14]);
// forest
place('chopping-block-073b5e', -64, 17, 0, { name: 'chop' });
place('open-woodshed-050a0a', -76, 26, 0, { faceTo: [-68, 6] });
place('firewood-stack-8a2899', -70, 22, 0.4);
place('stone-fire-pit-4136b0', -86, -6);
place('trail-signpost-bd29a7', -50, 0, 1.2);
scatter(['tall-pine-tree-ab4108', 'maple-tree-65fa12', 'birch-tree-181b33', 'broadleaf-oak-997c22', 'young-pine-0d7695', 'tall-pine-tree-ab4108'],
  95, -150, -48, -80, 40, [[-80, 8, 13], [-64, 17, 7], [-76, 26, 7], [-60, 5, 6], [-86, -6, 6], [-60, -26, 9]]);
scatter(['round-bush-cd2ac0', 'fern-plant-1559b8', 'medium-rock-e08405', 'fallen-log-1685fb', 'toadstool-257a4a', 'wildflower-68d3a1'],
  60, -140, -45, -70, 38, [[-80, 8, 12], [-64, 17, 5]]);
scatter(['tall-pine-tree-ab4108', 'broadleaf-oak-997c22', 'birch-tree-181b33'], 30, -40, 110, -110, -62, [[32, -56, 12], [0, -54, 14]]);
scatter(['round-bush-cd2ac0', 'wildflower-68d3a1', 'medium-rock-e08405'], 30, -40, 100, -60, 38,
  [[0, 0, 30], [64, 4, 14], [60, 30, 18], [59, -24, 22], [82, -8, 14], [40, 16, 8], [20, -17, 12], [-21, -15, 10], [-22, 15, 10], [22, 17, 10], [32, -56, 10], [0, -54, 12], [-38, -14, 8]]);
// harbour
place('dock-warehouse-bf0967', 24, 50, 0, { faceTo: [0, 44] });
place('lookout-watchtower-f1a5ce', 44, 50, 0, { faceTo: [0, 44] });
place('shipwright-boat-shed-9cbbc1', -42, 50, 0, { faceTo: [0, 44] });
for (const [x, z] of [[-56, 46], [-34, 44], [52, 44], [64, 47], [-64, 50], [70, 44]]) place('palm-tree-a307da', x, z, rnd() * 6);
for (const [x, z] of [[14, 46], [15, 47.5], [16.5, 46.2]]) place('barrel-8d63c4', x, z, rnd() * 6);
for (const [x, z] of [[30, 44], [31.4, 44.4], [30.6, 45.6]]) place('cargo-crate-9afc44', x, z, rnd() * 6);
place('drying-net-rack-93ec3b', -12, 45, 0.2);
place('ship-anchor-c2b4f1', -6, 42, 0.4);

// lamps: posts glow at night; only a few carry real lights
const lamps = [];
function lamp(id, x, z, withLight) {
  loadTotal++;
  jobs.push((async () => {
    const o = await make(id); o.position.set(x, groundY(x, z), z); scene.add(o);
    const top = new THREE.Box3().setFromObject(o).max.y - 0.35;
    const g = glow(3.2); g.position.set(x, top, z); scene.add(g);
    const l = withLight ? new THREE.PointLight(0xffb85a, 0, 22, 1.6) : null;
    if (l) { l.position.set(x, top, z); scene.add(l); }
    lamps.push({ g, l });
    tick();
  })());
}

class Person {
  constructor(name, role, id, home, clips, opts = {}) {

    const s = typeof key === 'string' ? SPOTS[key] : key;

    if (plan.carry) this.anim.play('Walk carrying'); else this.anim.locomotion(this.speed);
    const where = PLACE_NAMES[plan.spot === 'home' ? 'home' : (plan.place || key)] || 'somewhere';
    this.doing = plan.moveText || `${plan.run ? 'running' : 'walking'} to ${where}`;

  }
  arrive() {

  s.obj.rotation.set(Math.sin(t * 0.8 + x) * 0.035 * k, yaw, Math.sin(t * 0.6 + z) * 0.05 * k, 'YXZ');
}
const birds = [];
{
  const mat = new THREE.MeshLambertMaterial({ color: 0xf4f4f4, side: THREE.DoubleSide });
  for (let i = 0; i < 12; i++) {
    const b = new THREE.Group();
    const body = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.8, 5).rotateX(Math.PI / 2), mat);
    const wl = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.32).translate(-0.5, 0, 0).rotateX(-Math.PI / 2), mat);
    const wr = wl.clone(); wr.scale.x = -1;
    b.add(body, wl, wr); b.userData = { wl, wr, r: rr(14, 34), h: rr(10, 22), sp: rr(0.25, 0.45) * (rnd() < 0.5 ? 1 : -1), a: rr(0, 6.28),
      c: i < 8 ? V(rr(-10, 20), rr(60, 85)) : V(rr(-90, -60), rr(-20, 20)), f: rr(6, 9) };
    birds.push(b); scene.add(b);
  }
}

// ------------------------------------------------------------------ fireflies and rain
const flies = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(90 * 3), 3)),
  new THREE.PointsMaterial({ color: 0xd8ff7a, size: 0.35, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
const flySeeds = Array.from({ length: 90 }, () => [rr(-120, -50), rr(-40, 35), rr(0.5, 3), rr(0, 6.28)]);
scene.add(flies);
const RAIN_N = 2600;
const rainGeo = new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(RAIN_N * 6), 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0xaac4e0, transparent: true, opacity: 0 }));
const rainDrops = Array.from({ length: RAIN_N }, () => [rr(-70, 70), rr(0, 40), rr(-70, 70)]);
rain.frustumCulled = false;
scene.add(rain);
let rainAmt = 0;

// ------------------------------------------------------------------ events
const events = { bearHour: 15.6, rainHour: null, foxHour: 2.2, sloopHour: 16.3, bearDone: false, foxDone: false, rainDone: true, sloopDone: false };
let lastDay = 1;
let spotlight = null;      // { subject, sub, text, until } asks the camera to cut
let realNow = 0;           // seconds of real (unscaled) time; the camera director runs on it
function shout(subject, sub, text, secs = 16) { spotlight = { subject, sub, text, until: realNow + secs, fresh: true }; }

function newDay() {
  events.bearHour = rnd() < 0.7 ? rr(9.5, 16) : null;
  events.rainHour = rnd() < 0.5 ? rr(8, 17) : null;
  events.foxHour = rr(1, 4);
  events.bearDone = events.foxDone = events.rainDone = events.sloopDone = false;
  log(`A new day dawns over Saltmeadow (day ${dayNow()}).`);
}
function runEvents(h) {
  if (dayNow() !== lastDay) { lastDay = dayNow(); newDay(); }
  // the bear wanders into town
  if (!events.bearDone && events.bearHour != null && h >= events.bearHour && h < 18 && bear.ready) {
    events.bearDone = true; bear.held = true; bear.inTown = true;
    bear.mood = 'lumbering toward the village';
    bear.go([[-70, 5], [-52, 4], [-28, 0], [-3, 3]], 2.1, () => {
      bear.mood = 'sniffing around the plaza';
      shout(bear, 'Trouble in the plaza', 'The bear has the whole plaza to itself...', 12);
      setTimeout(() => {}, 0);
      const g = people.find(p => p.role === 'guard');
      g.locked = false;
      g.start({ spot: 'bearSpot', run: true, act: 'Punch', dur: 6, exact: true, look: [bear.pos.x, bear.pos.z], text: 'shooing the bear away!',
        logText: 'Hollis the guard charges at the bear!', onArrive: () => {
          shout(g, 'Hollis vs. the bear', 'Hollis the guard shooing the bear away!', 10);
          setTimeout(() => {
            bear.mood = 'running back to the woods';
            bear.go([[-28, 0], [-52, 4], [-75, 0], [-105, -10]], 2.6, () => { bear.held = false; bear.inTown = false; bear.mood = null; });
            log('The bear lumbers back into the woods.');
          }, 3500);
        } });
    });
    log('A black bear is wandering out of the forest toward town!');
    shout(bear, 'Something is coming out of the woods', 'A black bear heads for the village...', 14);
  }
  if (bear.inTown) for (const p of people) {
    if (!p.ready || p.hidden || p.role === 'guard' || p.fleeing) continue;
    if (p.pos.distanceTo(bear.pos) < 17) {
      p.fleeing = true;
      p.start({ spot: 'home', run: true, hide: true, dur: 30, moveText: 'running from the bear!', onArrive: () => { setTimeout(() => p.fleeing = false, 8000); } });
      if (rnd() < 0.5) log(`${p.name} runs from the bear!`);
    }
  }
  // the pirates sail in
  if (!events.sloopDone && h >= events.sloopHour && h < 23 && sloop.state === 'away') {
    events.sloopDone = true; sloop.state = 'in'; sloop.u = 0; sloop.obj.visible = true;
    log('Sails on the horizon: a pirate sloop is heading for the harbour!');
    shout(sloop, 'Ship ahoy', 'A pirate sloop is making for Saltmeadow harbour', 18);
  }
  if (sloop.state === 'docked' && inH(h, 1.5, 6) && pirates.every(p => p.aboard) && !sloop.leavingStarted) {
    sloop.leavingStarted = true; sloop.state = 'out'; sloop.u = 0; sloop.docked = false;
    log('The pirates stagger aboard and the sloop slips out to sea.');
    shout(sloop, 'Fair winds', 'The pirates sail off into the night', 14);
  }
  if (sloop.state === 'docked' && inH(h, 1.5, 6)) sloop.leaving = true;
  // the fox and the chickens
  if (!events.foxDone && h >= events.foxHour && h < 5 && fox.ready) {
    events.foxDone = true; fox.held = true;
    fox.mood = 'sneaking toward the chickens';
    fox.go([[-60, 0], [-28, 0], [28, 0], [40, 8], [42, 14]], 1.6, () => {
      fox.mood = 'eyeing the chicken coop';
      shout(fox, 'Midnight snack?', 'The fox has found the chicken coop...', 10);
      log('Rufus wakes up and barks at the fox!');
      dog.held = true; dog.go([[44, 12]], 3, () => {});
      setTimeout(() => {
        fox.mood = 'fleeing from Rufus!'; dog.mood = 'chasing the fox off!';
        fox.go([[30, 0], [-28, 0], [-60, 0], [-100, -10]], 3.2, () => { fox.held = false; fox.mood = null; });
        log('The fox bolts back to the woods, empty-mouthed.');
        setTimeout(() => { dog.held = false; dog.mood = null; }, 6000);
      }, 2500);
    });
    log('A fox slips out of the forest toward the farm...');
  }
  // a rain shower
  if (!events.rainDone && events.rainHour != null && h >= events.rainHour) { events.rainDone = true; events.rainUntil = h + 1.3; log('Dark clouds roll in. Rain!'); }
}
// the dog follows Mara around the farm in daytime
dog.follow = d => {
  const m = people[0];
  if (d.held || !m.ready || m.hidden || !inH(hourNow(), 6, 19)) return;
  const far = d.pos.distanceTo(m.pos);
  if (far > 6 && (!d.goal || d.goal.distanceTo(m.pos) > 4)) d.go([[m.pos.x + 1.5, m.pos.z + 1.5]], far > 14 ? 2.6 : 1.2);
};

// ------------------------------------------------------------------ day and night
const SKY = [[0, 0x0b1022], [4.6, 0x101a36], [5.6, 0xe59a6a], [6.8, 0x9cc4e4], [18.2, 0x9cc4e4], [19.3, 0xf08a5d], [20.2, 0x3b2d5a], [21, 0x0b1022], [24, 0x0b1022]];
const cA = new THREE.Color(), cB = new THREE.Color();
function skyAt(h, out) {
  for (let i = 0; i < SKY.length - 1; i++) if (h >= SKY[i][0] && h <= SKY[i + 1][0]) {
    const t = (h - SKY[i][0]) / (SKY[i + 1][0] - SKY[i][0]); return out.copy(cA.set(SKY[i][1])).lerp(cB.set(SKY[i + 1][1]), t); }
  return out.set(SKY[0][1]);
}
const grey = new THREE.Color(0x5d6670);
function updateSky(h, focus) {
  const a = (h - 5.3) / 14.9 * Math.PI;           // sun up about 5:20 am, down about 8:10 pm
  const sy = Math.sin(a);
  const day = THREE.MathUtils.smoothstep(sy, -0.12, 0.25);
  if (events.rainUntil && h < events.rainUntil && h > events.rainUntil - 1.4) rainAmt = Math.min(1, rainAmt + 0.01); else rainAmt = Math.max(0, rainAmt - 0.005);
  skyAt(h, scene.background);
  scene.background.lerp(grey, rainAmt * 0.6 * day);
  scene.fog.color.copy(scene.background);
  scene.fog.far = 420 - rainAmt * 220;
  sun.position.set(focus.x + Math.cos(a) * 160, Math.max(sy, 0.05) * 170, focus.z - 60);
  sun.target.position.copy(focus);
  sun.intensity = day * 2.6 * (1 - rainAmt * 0.6);
  sun.color.setHSL(0.09, 0.6, 0.6 + 0.3 * Math.min(1, sy * 2));
  moon.position.set(focus.x - 80, 120, focus.z + 40); moon.target.position.copy(focus);
  moon.intensity = (1 - day) * 0.55;
  hemi.intensity = 0.25 + day * 1.0;
  hemi.color.set(day > 0.5 ? 0xdfefff : 0x6a7cc0);
  stars.material.opacity = (1 - day) * 0.9 * (1 - rainAmt);
  for (const c of clouds) c.children[0].material.opacity = 0.92;
  clouds[0].children[0].material.color.setScalar(0.35 + day * 0.65);
  renderer.toneMappingExposure = 0.9 + (1 - day) * 0.25;
  const lampsOn = THREE.MathUtils.clamp(1 - day * 1.4, 0, 1);
  for (const l of lamps) { l.g.material.opacity = lampsOn * 0.95; if (l.l) l.l.intensity = lampsOn * 14; }
  const fire = party(h) || inH(h, 19.5, 1.5);
  const flick = Math.sin(simT * 17) * 0.15 + Math.sin(simT * 7.3) * 0.1;
  fireLight.intensity = fire ? (20 + flick * 30) * (0.4 + lampsOn * 0.6) : 0;
  fireGlow.material.opacity = fire ? 0.9 + flick : 0;
  for (const f of flames) { f.visible = fire; const k = f.userData.k, hh = f.userData.h * (0.75 + 0.25 * Math.sin(simT * 9 + k) + 0.1 * Math.sin(simT * 23 + k));
    f.scale.set(1, hh, 1); f.position.y = 0.25 + hh / 2; f.rotation.y = simT * 2 + k; }

}

// ------------------------------------------------------------------ the camera director
const capSub = document.getElementById('caption');
let auto = true, shot = null;
const camLook = new THREE.Vector3(0, 2, 0);
const camBtn = document.getElementById('camBtn');
function setAuto(on) { auto = on; controls.enabled = !on; camBtn.classList.toggle('on', on); camBtn.textContent = on ? 'Auto camera' : 'Free camera';
  if (!on) controls.target.copy(camLook); else shot = null; }
camBtn.onclick = () => setAuto(!auto);
renderer.domElement.addEventListener('pointerdown', () => { if (auto) setAuto(false); });
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => { speed = +b.dataset.speed;
  document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x === b)); });
let speed = 1;

function subjectPos(s) { return s.pos || s.obj.position; }
function describe(s) {
  if (s instanceof Person) return [`${s.name}, ${s.role === 'pirate' ? (s.opts.captain ? 'pirate captain' : 'pirate deckhand') : ROLE_NAME[s.role]}`, s.doing];
  if (s instanceof Beast) return [s.name[0].toUpperCase() + s.name.slice(1), s.mood || (s.goal ? (s.speedMul > 1.8 ? 'running!' : 'wandering') : 'having a look around')];
  if (s === sloop) return ['The pirate sloop', sloop.state === 'in' ? 'coming in to dock' : sloop.state === 'out' ? 'heading back out to sea' : 'tied up at the pier'];
  if (s === galleon) return ['A big galleon', 'sailing past the bay'];
  return ['', ''];
}
function chooseShot(now) {
  const h = hourNow();
  if (spotlight && spotlight.until > now) {
    spotlight.fresh = false;
    const s = spotlight.subject;
    return { kind: s === sloop || s === galleon ? 'ship' : 'follow', subj: s, end: spotlight.until, a: rr(0, 6.28), title: spotlight.text, sub: spotlight.sub };
  }
  const visible = people.filter(p => p.ready && !p.hidden);
  const opts = [];
  for (const p of visible) opts.push([p.moving ? 1 : 2.2, { kind: 'follow', subj: p }]);
  if (party(h) && visible.length) opts.push([7, { kind: 'orbit', c: V(9, 8, 1.2), r: 13, y: 5, title: 'The bonfire party', sub: 'Saltmeadow at night' }]);
  opts.push([2.5, { kind: 'orbit', c: V(8, -6, 2), r: 120, y: 62, title: 'Saltmeadow', sub: dayPart(h) }]);
  opts.push([1.5, { kind: 'orbit', c: V(0, 50, 2), r: 55, y: 22, title: 'The harbour', sub: dayPart(h) }]);
  opts.push([1.2, { kind: 'orbit', c: V(60, 10, 2), r: 42, y: 20, title: 'Mara\'s farm', sub: dayPart(h) }]);
  for (const a of animals) if (a.ready) opts.push([a === bear || a === fox ? 1.2 : 0.25, { kind: 'follow', subj: a, close: true }]);
  if (galleon.ready) opts.push([0.9, { kind: 'ship', subj: galleon }]);
  if (sloop.ready && sloop.state !== 'away') opts.push([1.4, { kind: 'ship', subj: sloop }]);
  if (inH(h, 19.5, 5.5)) { const g = people.find(p => p.role === 'guard'); if (g?.ready) opts.push([3, { kind: 'follow', subj: g }]); }
  let tot = opts.reduce((s, o) => s + o[0], 0), r = rnd() * tot;
  for (const [w, o] of opts) { if ((r -= w) <= 0) { o.end = now + rr(9, 14); o.a = rr(0, 6.28); return o; } }
  return { kind: 'orbit', c: V(0, 0, 2), r: 110, y: 60, end: now + 10, a: 0 };
}
function dayPart(h) { return inH(h, 5, 8) ? 'Early morning' : inH(h, 8, 12) ? 'Morning' : inH(h, 12, 17) ? 'Afternoon' : inH(h, 17, 20) ? 'Evening' : 'Night'; }
const want = new THREE.Vector3(), wantLook = new THREE.Vector3();
function direct(now, dt) {
  if (!shot || now > shot.end || (spotlight && spotlight.fresh)) {
    shot = chooseShot(now); shot.t0 = now; shot.cut = true;
    if (shot.subj instanceof Person && shot.subj.hidden) shot.end = now;     // pick again next frame
  }
  const t = now - shot.t0;
  if (shot.kind === 'orbit') {
    const a = shot.a + t * (shot.r > 80 ? 0.025 : 0.07);
    want.set(shot.c.x + Math.cos(a) * shot.r, shot.y, shot.c.z + Math.sin(a) * shot.r);
    wantLook.copy(shot.c);
    caption(shot.title, shot.sub);
  } else {
    const p = subjectPos(shot.subj);
    const ship = shot.kind === 'ship';
    const close = shot.close;
    const dist = ship ? 38 : close ? 6 : 8.5, hgt = ship ? 16 : close ? 2.6 : 3.6;
    const a = shot.a + t * 0.12;
    want.set(p.x + Math.cos(a) * dist, p.y + hgt, p.z + Math.sin(a) * dist);
    if (want.y < groundY(want.x, want.z) + 0.8) want.y = groundY(want.x, want.z) + 0.8;
    wantLook.set(p.x, p.y + (ship ? 4 : close ? 0.5 : 1.2), p.z);
    const [title, doing] = describe(shot.subj);
    if (shot.title && t < 6) caption(shot.title, shot.sub); else caption(doing ? `${title} · ${doing}` : title, dayPart(hourNow()));
    if (shot.subj instanceof Person && shot.subj.hidden && !shot.title) shot.end = Math.min(shot.end, now + 1.5);
  }
  if (shot.cut) { camera.position.copy(want); camLook.copy(wantLook); shot.cut = false; }
  else { const k = 1 - Math.exp(-2.5 * dt); camera.position.lerp(want, k); camLook.lerp(wantLook, 1 - Math.exp(-5 * dt)); }
  camera.lookAt(camLook);
}

// ------------------------------------------------------------------ main loop
const clock = new THREE.Clock();
const clockEl = document.getElementById('clock');
function frame(fixed) {
  const rdt = fixed || Math.min(clock.getDelta(), 0.05);
  const dt = rdt * speed;
  const now = (realNow += rdt);
  simT += dt;
  const h = hourNow();
  runEvents(h);
  for (const p of people) p.update(dt);
  for (const a of animals) a.update(dt);
  // ships
  if (galleon.ready) { const a = simT * 0.012, x = 40 + Math.cos(a) * 150, z = 200 + Math.sin(a) * 60;
    shipPose(galleon, x, z, Math.atan2(-Math.sin(a) * 150, Math.cos(a) * 60), simT, 1.4); }
  if (rowboat.ready) shipPose(rowboat, -8, 60 + Math.sin(simT * 0.05) * 0.5, 0.4, simT, 2);
  if (sloop.ready) {
    if (sloop.state === 'away') sloop.obj.visible = false;
    else if (sloop.state === 'in' || sloop.state === 'out') {
      const curve = sloop.state === 'in' ? sloopIn : sloopOut, L = curve.getLength();
      const slow = sloop.state === 'in' ? THREE.MathUtils.clamp((1 - sloop.u) * 6, 0.12, 1) : THREE.MathUtils.clamp(sloop.u * 8 + 0.15, 0.15, 1);
      sloop.u = Math.min(1, sloop.u + dt * 7 * slow / L);
      const p = curve.getPointAt(sloop.u), tg = curve.getTangentAt(Math.min(sloop.u, 0.999));
      shipPose(sloop, p.x, p.z, Math.atan2(tg.x, tg.z), simT);
      if (sloop.u >= 1) {
        if (sloop.state === 'in') {
          sloop.state = 'docked'; sloop.docked = true; sloop.leaving = false; sloop.leavingStarted = false;
          log('The sloop ties up at the pier. Pirates come ashore, looking thirsty.');
          pirates.forEach((p, i) => { p.aboard = false; p.obj.position.set(2.2, 0.35, DOCK.z - 1 + i * 1.3); p.hidden = false; p.obj.visible = true; p.until = simT + i * 2; });
          shout(pirates[0], 'Visitors', 'Captain Redd steps ashore, looking for the tavern', 12);
        } else { sloop.state = 'away'; sloop.obj.visible = false; }
      }
    } else if (sloop.state === 'docked') shipPose(sloop, DOCK.x, DOCK.z, Math.PI, simT, 0.5);
  }
  for (const b of birds) { const u = b.userData; u.a += u.sp * dt / 1; const x = u.c.x + Math.cos(u.a) * u.r, z = u.c.z + Math.sin(u.a) * u.r;
    b.position.set(x, u.h + Math.sin(u.a * 3) * 1.2, z); b.rotation.y = Math.atan2(-Math.sin(u.a) * u.sp, Math.cos(u.a) * u.sp);
    const f = Math.sin(simT * u.f) * 0.6; u.wl.rotation.z = f; u.wr.rotation.z = -f; }
  for (const c of clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 380) c.position.x = -380; }
  { const p = flies.geometry.attributes.position; flySeeds.forEach((s, i) => p.setXYZ(i, s[0] + Math.sin(simT * 0.3 + s[3]) * 2, s[2] + Math.sin(simT * 0.9 + s[3]) * 0.5, s[1] + Math.cos(simT * 0.25 + s[3]) * 2)); p.needsUpdate = true; }
  if (rainAmt > 0.01) { const p = rainGeo.attributes.position; const cx = camLook.x, cz = camLook.z;
    rainDrops.forEach((d, i) => { d[1] -= dt * 38; if (d[1] < 0) { d[1] += 40; d[0] = rr(-70, 70); d[2] = rr(-70, 70); }
      p.setXYZ(i * 2, cx + d[0], d[1], cz + d[2]); p.setXYZ(i * 2 + 1, cx + d[0] + 0.15, d[1] + 1.1, cz + d[2]); }); p.needsUpdate = true; }
  rain.material.opacity = rainAmt * 0.55;
  updateSea(simT);
  if (auto) direct(now, rdt); else { controls.update(); camLook.copy(controls.target); }
  updateSky(h, camLook);
  if (placed.tavern) tavernLight.position.set(placed.tavern.position.x - 4, 3, placed.tavern.position.z + 6);
  clockEl.textContent = `Day ${dayNow()} · ${clockText(h)}`;
  renderer.render(scene, camera);
}

// ------------------------------------------------------------------ start
(async () => {
  await Promise.all([...people.map(p => p.load()), ...animals.map(a => a.load()), galleon.load(), sloop.load(), rowboat.load(), ...jobs]);
  await Promise.all(jobs);
  for (const p of people) if (p.ready && !p.opts.startHidden) { const s = SPOTS[homeSpot(p.home)]; p.obj.position.set(s.x, 0, s.z); p.think(); }
  const tl = placed.tavern; if (tl) tavernLight.position.set(tl.position.x, 3, tl.position.z);
  document.getElementById('loading').style.opacity = '0';
  setTimeout(() => document.getElementById('loading').remove(), 1100);
  log('Afternoon in Saltmeadow. Everyone is going about their business.');
  renderer.setAnimationLoop(() => frame());
  window.SM = { people, animals, sloop, galleon, events, renderer, get simT() { return simT; }, set simT(v) { simT = v; },
    step(secs, sp = 1) { const s0 = speed; speed = sp; for (let i = 0; i < secs * 30; i++) frame(1 / 30); speed = s0; },
    look(subj) { setAuto(true); shout(subj, 'test', 'test', 30); } };
})();
</script>
